name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: compose config
        env:
          GARAGE_RPC_SECRET: ci
          GARAGE_ADMIN_TOKEN: ci
        run: docker compose config -q
